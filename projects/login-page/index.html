<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Login Page</title>
    <link rel="stylesheet" href="/projects/login-page/style.css" />
  </head>
  <body>
    <a id="return-to-main-button" href="/projects/project-index.html">Return to Main</a>
    <div id="outer-container">
      <div id="login-container">
        <form id="login-form">
          <h1 id="login-header">Sample Login</h1>

          <div id="login-input-container">
            <label for="username">Username</label>
            <input class="login-input" id="username" type="text" name="username" />

            <label for="password">Password</label>
            <input class="login-input" id="password" type="text" name="password" />
          </div>

          <button id="submit-button" type="submit">Log In</button>
        </form>
      </div>
    </div>
  </body>
</html>
